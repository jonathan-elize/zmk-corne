# ######################################################
# Board Specific
# ######################################################
CONFIG_ZMK_KEYBOARD_NAME="black"

# Screen config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Enable mouse
CONFIG_ZMK_POINTING=y

# ######################################################
# Board Specific
# ######################################################
# Activate on nice view
CONFIG_NICE_EPAPER_ON=y

# Boost bluetooth connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keep animations going
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# main setup
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# Peripheral/right display
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# hide modifiers
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
# if modifiers are showing show on thhe screen properly
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=0
